[build-system]
requires = ["setuptools>=77"]  # 77+ for the SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "project-md"
version = "0.1.0"
description = "Pre-flight architecture engine: turns a plain-English idea into a vetted stack and native AI context files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Non-negotiable: standard library only. Do not add runtime dependencies.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
project-md = "project_md.cli:main"

[tool.setuptools.packages.find]
include = ["project_md*"]
